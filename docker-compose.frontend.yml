name: enterprise-frontend

services:
  hub-frontend:
    image: ghcr.io/opendevtools-org/homelab-hub:${HUB_VERSION:-enterprise}
    pull_policy: always
    restart: unless-stopped
    environment:
      HUB_API_UPSTREAM: http://hub-backend:8090
    ports:
      - "${FE_BIND:-127.0.0.1}:${FE_PORT:-3080}:80"
    networks:
      - default
      - backend

networks:
  backend:
    external: true
    name: enterprise-backend_default
